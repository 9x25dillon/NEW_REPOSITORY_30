<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acoustofluidic Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --ground:#eef1f5; --surface:#f8fafb; --sunk:#e3e8ee;
  --ink:#16202a; --ink-2:#47596a; --ink-3:#74889a;
  --rule:#ccd6e0; --rule-soft:#dee5ec;
  --accent:#0f7680; --accent-soft:#d6ecee;
  --measured:#146e50; --measured-bg:#dcefe7;
  --derived:#275f96;  --derived-bg:#dde9f5;
  --assumed:#94590f;  --assumed-bg:#f6e9d5;
  --stop:#a3352b; --stop-bg:#f7dedb;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0d131a; --surface:#141d26; --sunk:#1a242f;
  --ink:#dfe8f0; --ink-2:#9fb2c2; --ink-3:#708496;
  --rule:#26333f; --rule-soft:#1e2934;
  --accent:#45bfc9; --accent-soft:#123037;
  --measured:#45c79b; --measured-bg:#102e26;
  --derived:#6fb0e8;  --derived-bg:#12263a;
  --assumed:#e0a355;  --assumed-bg:#33240f;
  --stop:#f08a7e; --stop-bg:#3a1a16;
}}
:root[data-theme="dark"]{
  --ground:#0d131a; --surface:#141d26; --sunk:#1a242f;
  --ink:#dfe8f0; --ink-2:#9fb2c2; --ink-3:#708496;
  --rule:#26333f; --rule-soft:#1e2934;
  --accent:#45bfc9; --accent-soft:#123037;
  --measured:#45c79b; --measured-bg:#102e26;
  --derived:#6fb0e8;  --derived-bg:#12263a;
  --assumed:#e0a355;  --assumed-bg:#33240f;
  --stop:#f08a7e; --stop-bg:#3a1a16;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
header.top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--rule);background:var(--sunk);flex-wrap:wrap}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--accent)}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{font-family:var(--sans);font-size:13px;font-weight:500;padding:6px 14px;border-radius:5px;border:1px solid transparent;background:none;color:var(--ink-2);cursor:pointer}
nav button:hover{color:var(--ink)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);font-weight:600}
nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1120px;margin:0 auto;padding:22px 20px 80px}
h2{font-size:1.15rem;font-weight:600;margin:0 0 3px;letter-spacing:-.01em}
.sub{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 18px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:3px;letter-spacing:.02em}
input,select,textarea{width:100%;font-family:var(--mono);font-size:13px;padding:6px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--ground);color:var(--ink);font-variant-numeric:tabular-nums}
textarea{line-height:1.45;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{border:1px solid var(--rule-soft);border-left-width:3px;border-radius:5px;padding:9px 11px;background:var(--ground)}
.tile.measured{border-left-color:var(--measured)}.tile.derived{border-left-color:var(--derived)}.tile.assumed{border-left-color:var(--assumed)}
.tile .k{font-size:10.5px;color:var(--ink-3);display:block;margin-bottom:3px}
.tile .n{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;display:block}
.tile .n .u{font-size:11px;font-weight:400;color:var(--ink-3);margin-left:2px}
.chip{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;padding:1.5px 5px;border-radius:2.5px;font-weight:600;display:inline-block;margin-top:5px}
.chip.measured{background:var(--measured-bg);color:var(--measured)}
.chip.derived{background:var(--derived-bg);color:var(--derived)}
.chip.assumed{background:var(--assumed-bg);color:var(--assumed)}
.verdict{border:1px solid var(--rule-soft);border-left:3px solid var(--assumed);border-radius:5px;padding:11px 13px;background:var(--ground);margin-bottom:14px}
.verdict.derived{border-left-color:var(--derived)}.verdict.measured{border-left-color:var(--measured)}
.verdict .lead{font-size:15px;font-weight:600;margin-bottom:3px}
.verdict .why{font-size:12.5px;color:var(--ink-2)}
.guard{border:1px solid color-mix(in srgb,var(--stop) 35%,transparent);border-left:3px solid var(--stop);background:var(--stop-bg);border-radius:5px;padding:9px 12px;margin-bottom:10px;font-size:12.5px}
.guard b{color:var(--stop);display:block;font-size:12px;letter-spacing:.02em}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--rule-soft);white-space:nowrap}
th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border-bottom-color:var(--rule)}
td.mono,th.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.no td{color:var(--ink-3);opacity:.62}
.yes{color:var(--measured);font-weight:600}.nope{color:var(--ink-3)}
.scroll{overflow-x:auto}
.btn{font-family:var(--sans);font-size:13px;font-weight:600;padding:7px 16px;border-radius:5px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);cursor:pointer}
.btn:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.note{font-size:12px;color:var(--ink-3);margin:8px 0 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-bottom:14px}
.legend b{font-weight:600}
.err{color:var(--stop);font-size:12.5px;margin-top:8px}
.ok{color:var(--measured);font-size:12.5px;margin-top:8px;font-weight:500}
</style>
</head>
<body>
<header class="top">
  <span class="brand">Acoustofluidic Bench</span>
  <nav id="nav">
    <button data-view="substrates" aria-current="true">Substrates</button>
    <button data-view="device">Device</button>
    <button data-view="measure">Measure</button>
    <button data-view="crystals">Crystals</button>
  </nav>
</header>
<main id="root"></main>
<script type="module" src="./dist/app/main.js"></script>
</body>
</html>
